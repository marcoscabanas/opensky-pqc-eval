[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensky-pqc-eval"
version = "0.1.0"
description = "Post-quantum signature evaluation for ADS-B authentication using OpenSky capture data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.25",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
crypto = ["cryptography>=50.0.0", "liboqs-python>=0.16.0"]

[tool.setuptools]
package-dir = {"" = "."}
packages = [
  "src",
  "src.analysis",
  "src.processing",
  "src.experiment",
  "src.crypto",
]
